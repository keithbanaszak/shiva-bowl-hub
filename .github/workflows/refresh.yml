name: Refresh Sleeper data

# Pulls the current season from Sleeper, pulls the league-config Google Sheet,
# rebuilds the marts, and commits anything that changed. The commit is what
# ships the update: Vercel builds with `next build`, which reads the COMMITTED
# marts — it never runs data:build — so nothing reaches the live site until the
# data is committed here.
#
# Cadence: daily during the NFL season (Sep–Jan), when waivers, trades and cuts
# happen almost every day, so the site stays near-live; weekly on Tuesdays the
# rest of the year, which still catches dynasty offseason moves (a July check
# once found three unrecorded drops) without pointless runs. Off-:00 minute to
# dodge GitHub's high-load scheduling delays. Always runnable on demand.
on:
  schedule:
    - cron: "17 13 * 9-12,1 *" # daily, September–January (in-season)
    - cron: "17 13 * 2-8 2" # Tuesdays, February–August (offseason)
  workflow_dispatch:

# allow the job to push the refreshed data commit
permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Job-level so the step `if:` below can read it — a step's own `env` is not
    # reliably available in that same step's `if` expression.
    env:
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `npm install`, not `npm ci`: the committed lockfile is generated on
      # Windows and omits Linux-only optional native deps (@emnapi/*, pulled by
      # Next's lightningcss/oxide toolchain), which `npm ci` refuses on the Linux
      # runner ("Missing … from lock file"). `npm install` resolves what this
      # platform needs at install time and tolerates that cross-platform gap. It
      # may touch package-lock.json in the runner, but the commit step below only
      # stages data/** and the search index, so the lockfile is never committed.
      - run: npm install --no-audit --no-fund

      # ingest current week + pull the config sheet + rebuild every mart
      - run: npm run data:refresh

      # Commit the generated outputs. IMPORTANT: this must include
      # public/search-index.json (the ⌘K index, regenerated by data:build but
      # living outside data/) — otherwise a refresh that adds a new player would
      # never surface him in search on the deployed site.
      - name: Commit refreshed data
        id: commit
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(data): scheduled Sleeper refresh"
          file_pattern: "data/** public/search-index.json"
          commit_user_name: shiva-bowl-bot
          commit_user_email: actions@github.com

      # Trigger a Vercel production deploy for the new data.
      #
      # If you've connected this GitHub repo to the Vercel project (the
      # recommended setup — see README), the push above already redeploys and
      # this step is a harmless no-op because the secret is unset. If you have
      # NOT connected git, create a Deploy Hook in Vercel
      # (Project → Settings → Git → Deploy Hooks) and store its URL as the repo
      # secret VERCEL_DEPLOY_HOOK, and this becomes the thing that ships it.
      - name: Trigger Vercel deploy
        if: steps.commit.outputs.changes_detected == 'true' && env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK" && echo "Vercel deploy triggered."
